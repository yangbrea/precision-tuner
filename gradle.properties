# JVM options for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Use Android Studio's bundled JDK (Java 21). Environment-specific to this machine.
org.gradle.java.home=/opt/android-studio/jbr

# AndroidX
android.useAndroidX=true
# Only generate R classes for the current module (smaller, faster builds).
android.nonTransitiveRClass=true

# Kotlin code style
kotlin.code.style=official
# Compile Kotlin in-process: the Kotlin daemon cannot write its state to the
# read-only ~/.kotlin in this environment.
kotlin.compiler.execution.strategy=in-process
